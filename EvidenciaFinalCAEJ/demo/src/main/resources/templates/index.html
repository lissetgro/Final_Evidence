<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio | Recetario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .hero { text-align: center; background: white; padding: 3rem; border-radius: 1.5rem; shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="hero shadow-sm">
        <h1 class="display-4 fw-bold">🍳 Mi Recetario Digital</h1>
        <p class="lead text-muted">Tienes <strong th:text="${totalRecetas}">0</strong> recetas registradas.</p>
        <a th:href="@{/recetas}" class="btn btn-primary btn-lg px-5 shadow-sm">Consultar Recetas</a>
    </div>
</body>
</html>
