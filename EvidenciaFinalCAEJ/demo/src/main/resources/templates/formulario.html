<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario | Recetario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm border-0 p-4">
                    <h2 class="mb-4 fw-bold text-center" th:text="${receta.id == null ? 'Nueva Receta' : 'Editar Receta'}"></h2>
                    <form th:action="@{/recetas/guardar}" th:object="${receta}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ingredientes</label>
                            <div class="input-group mb-2">
                                <input type="text" id="inputIng" class="form-control" placeholder="Ej: 2 huevos">
                                <button type="button" class="btn btn-dark" onclick="addIng()">Agregar</button>
                            </div>
                            <ul id="listaIng" class="list-group mb-2"></ul>
                            <input type="hidden" th:field="*{ingredientes}" id="hiddenIng">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Instrucciones</label>
                            <textarea class="form-control" th:field="*{instrucciones}" rows="6"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm">Guardar</button>
                        <a th:href="@{/recetas}" class="btn btn-link w-100 text-muted mt-2">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        const input = document.getElementById('inputIng');
        const lista = document.getElementById('listaIng');
        const hidden = document.getElementById('hiddenIng');

        document.addEventListener("DOMContentLoaded", () => {
            if (hidden.value) {
                hidden.value.split(',').forEach(i => { if(i.trim()) addItem(i.trim()); });
            }
        });

        function addIng() {
            const val = input.value.trim();
            if (val) { addItem(val); updateHidden(); input.value = ""; }
        }

        function addItem(t) {
            const li = document.createElement('li');
            li.className = "list-group-item d-flex justify-content-between align-items-center";
            li.innerHTML = `<span class="val-ing">${t}</span>
                <button type="button" class="btn btn-sm btn-light text-danger" onclick="this.closest('li').remove(); updateHidden();">✕</button>`;
            lista.appendChild(li);
        }

        function updateHidden() {
            const all = Array.from(document.querySelectorAll('.val-ing')).map(s => s.innerText);
            hidden.value = all.join(',');
        }
    </script>
</body>
</html>
